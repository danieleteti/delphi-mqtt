# ---------------------------------------------------------------------------
# Mosquitto extra listeners: standard MQTT + WebSocket
# Drop this file into a directory referenced by `include_dir` in the main
# mosquitto.conf, OR append its contents at the end of mosquitto.conf.
#
# Once any explicit `listener` directive exists, the built-in default
# listener on 1883 is no longer created automatically, so we explicitly
# re-declare it here together with the new WebSocket listener on 9001.
# ---------------------------------------------------------------------------

# Standard MQTT over TCP
listener 1883
protocol mqtt
allow_anonymous true

# MQTT over WebSocket (e.g. for browser clients via Paho JS, MQTT.js)
listener 9001
protocol websockets
allow_anonymous true
